name: Build & Export

on:
  push:
    tags: ["*"]

jobs:
  build-libs:
    name: Build Lib (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: ubuntu-latest
          - platform: web
            os: ubuntu-latest
          - platform: macos
            os: macos-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install SCons (except MacOS)
        if: matrix.platform != 'macos'
        run: |
          sudo apt-get update
          sudo apt-get install -y scons build-essential

      - name: Install SCons (MacOS)
        if: matrix.platform == 'macos'
        run: |
          brew install scons

      - name: Install Win Compiler
        if: matrix.platform == 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64

      - name: Setup emsdk (Web only)
        if: matrix.platform == 'web'
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      - name: Build GDExtension
        working-directory: src
        run: scons platform=${{ matrix.platform }} target=template_release

      - name: Upload Library Artifact
        uses: actions/upload-artifact@v7
        with:
          name: lib-${{ matrix.platform }}
          path: src/bin/

  # JOB 2: Collect all libs and run the Godot Export
  export-game:
    name: Export Game
    needs: build-libs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # Download ALL libraries from the previous job into src/bin/
      - name: Download All Libs
        uses: actions/download-artifact@v8
        with:
          path: src/bin/
          pattern: lib-*
          merge-multiple: true

      - name: Verify All Libs Present
        run: ls -R src/bin/

      - name: Godot Export
        id: export
        uses: firebelley/godot-export@v7.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_export_templates.tpz
          relative_project_path: ./src/
          archive_output: true

      - name: Create Release
        uses: ncipollo/release-action@v1.18.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          draft: true
          artifacts: ${{ steps.export.outputs.archive_directory }}/*
