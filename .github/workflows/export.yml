name: Build & Export Linux

on:
  push:
    tags: ["*"]

env:
  GODOT_VERSION: 4.6.0
  EXPORT_NAME: favem-s-davem
  PROJECT_PATH: src

jobs:
  export-linux:
    name: Linux Export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download godot-cpp Builds
        uses: NodotProject/godot-cpp-builds@v1
        with:
          godot-version: '4.5-stable'
          godot-cpp-path: './src/godot-cpp'

      - name: Install Build Essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y scons build-essential

      - name: Build GDExtension
        run: |
          scons platform=${{ matrix.platform }} target=template_release

      - name: Export Project
        run: |
          mkdir -p build/linux
          godot --headless --path ${{ env.PROJECT_PATH }} --export-release "Linux" "../build/linux/${{ env.EXPORT_NAME }}.x86_64" || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: build/linux
