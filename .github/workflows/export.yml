name: Build & Export Linux

on:
  push:
    tags: ["*"]

env:
  GODOT_VERSION: 4.6.0
  EXPORT_NAME: favem-s-davem
  PROJECT_PATH: src

jobs:
  export-linux:
    name: Linux Export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Install Build Essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y scons build-essential

      - name: SCons Cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.PROJECT_PATH }}/.sconsign.dblite
            ${{ env.PROJECT_PATH }}/godot-cpp/gen/
            ${{ env.PROJECT_PATH }}/bin/
          key: ${{ runner.os }}-scons-${{ hashFiles('src/SConstruct', 'src/src/**') }}
          restore-keys: |
            ${{ runner.os }}-scons-

      - name: Build GDExtension Libraries
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          # godot can now "see" classes during export
          scons platform=linux target=editor dev_build=no
          # for the final binary
          scons platform=linux target=template_release dev_build=no

      - name: Import Assets
        run: |
          # this may fix error?
          godot --headless --display-driver dummy --path ${{ env.PROJECT_PATH }} --editor --quit-after 10

      - name: Export Project
        run: |
          mkdir -p build/linux
          godot --headless --path ${{ env.PROJECT_PATH }} --export-release "Linux" "../build/linux/${{ env.EXPORT_NAME }}.x86_64"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: build/linux
